<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Biosecurity Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

    <script>
        const API_URL = "http://127.0.0.1:8000";
        
        let selectedFile = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-emerald-600', 'text-emerald-700');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            document.getElementById('btn-' + tabId).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById('btn-' + tabId).classList.add('border-emerald-600', 'text-emerald-700');
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('image-preview-container').classList.remove('hidden');
                document.getElementById('image-preview').src = URL.createObjectURL(selectedFile);
                document.getElementById('image-result').classList.add('hidden');
                document.getElementById('image-error').classList.add('hidden');
            }
        }

        async function analyzeImage() {
            if (!selectedFile) return;
            const btn = document.getElementById('btn-analyze-image');
            btn.disabled = true;
            btn.innerText = 'Processing on Local GPU...';
            document.getElementById('image-error').classList.add('hidden');

            const formData = new FormData();
            formData.append("file", selectedFile);

            try {
                const response = await fetch(`${API_URL}/analyze-image`, { method: "POST", body: formData });
                if (!response.ok) throw new Error('Network error');
                const result = await response.json();
                
                document.getElementById('image-result').classList.remove('hidden');
                document.getElementById('res-disease').innerText = result.disease;
                document.getElementById('res-conf').innerText = result.confidence + '% Confidence';
                document.getElementById('dash-img-res').innerHTML = `<span class="font-medium">${result.disease}</span><span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">${result.confidence}% Confidence</span>`;
            } catch (error) {
                document.getElementById('image-error').classList.remove('hidden');
                document.getElementById('image-error').innerText = "Failed to connect to local API at 127.0.0.1:8000. Verify run_server.py is running.";
            } finally {
                btn.disabled = false;
                btn.innerText = 'Analyze Image';
            }
        }

        async function analyzeRisk(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-analyze-risk');
            btn.disabled = true;
            btn.innerText = 'Calculating...';
            document.getElementById('risk-error').classList.add('hidden');

            const formData = new FormData();
            formData.append("temperature", document.getElementById('temp').value);
            formData.append("humidity", document.getElementById('hum').value);
            formData.append("mortality", document.getElementById('mort').value);

            try {
                const response = await fetch(`${API_URL}/analyze-risk`, { method: "POST", body: formData });
                if (!response.ok) throw new Error('Network error');
                const result = await response.json();
                
                document.getElementById('risk-result').classList.remove('hidden');
                document.getElementById('res-score').innerText = result.risk_score + ' / 100';
                document.getElementById('res-status').innerText = result.status;
                
                let colorClass = result.risk_score > 75 ? 'text-red-700 bg-red-50' : result.risk_score > 40 ? 'text-yellow-700 bg-yellow-50' : 'text-green-700 bg-green-50';
                document.getElementById('dash-risk-res').innerHTML = `<div class="p-4 rounded border flex flex-col items-center justify-center ${colorClass}"><span class="text-3xl font-bold text-gray-800">${result.risk_score}</span><span class="text-sm font-bold uppercase">${result.status}</span></div>`;
            } catch (error) {
                document.getElementById('risk-error').classList.remove('hidden');
                document.getElementById('risk-error').innerText = "Failed to connect to local API at 127.0.0.1:8000. Verify run_server.py is running.";
            } finally {
                btn.disabled = false;
                btn.innerText = 'Calculate Outbreak Risk';
            }
        }
    </script>

    <header class="bg-emerald-700 text-white p-6 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Farm Biosecurity Portal</h1>
            <div class="text-sm bg-emerald-800 px-3 py-1 rounded-full border border-emerald-600">
                Backend Status: <span class="text-green-300 font-semibold">Local API Linked</span>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto flex space-x-8 px-6">
            <button id="btn-dashboard" onclick="switchTab('dashboard')" class="tab-btn py-4 font-medium border-b-2 border-emerald-600 text-emerald-700">Dashboard</button>
            <button id="btn-diagnostic" onclick="switchTab('diagnostic')" class="tab-btn py-4 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Visual Diagnostic AI</button>
            <button id="btn-risk" onclick="switchTab('risk')" class="tab-btn py-4 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Daily Risk Logs</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-4">
        
        <!-- DASHBOARD TAB -->
        <div id="dashboard" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Recent ML Detections</h2>
                <div id="dash-img-res" class="bg-gray-50 p-4 rounded border flex justify-between items-center">
                    <span class="text-gray-400 text-sm italic">No recent scans.</span>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Overall Farm Risk</h2>
                <div id="dash-risk-res">
                    <div class="text-gray-400 text-sm italic text-center py-4">Awaiting daily log input.</div>
                </div>
            </div>
        </div>

        <!-- DIAGNOSTIC AI TAB -->
        <div id="diagnostic" class="tab-content hidden bg-white p-8 rounded-lg shadow-sm border border-gray-100 max-w-2xl mx-auto">
            <h2 class="text-xl font-bold mb-4">Upload Fecal Image</h2>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center bg-gray-50">
                <input type="file" accept="image/*" onchange="handleFileSelect(event)" class="hidden" id="file-upload">
                <label for="file-upload" class="cursor-pointer flex flex-col items-center text-emerald-600 font-medium">
                    Click to upload image
                </label>
            </div>
            
            <div id="image-preview-container" class="mt-6 hidden">
                <img id="image-preview" class="max-h-64 mx-auto rounded shadow-sm border border-gray-200">
                <button id="btn-analyze-image" onclick="analyzeImage()" class="w-full mt-4 bg-emerald-600 text-white font-bold py-3 px-4 rounded disabled:opacity-50">Analyze Image</button>
            </div>
            <div id="image-error" class="mt-4 p-3 bg-red-100 text-red-700 rounded text-sm hidden"></div>
            <div id="image-result" class="mt-6 p-5 bg-blue-50 border border-blue-100 rounded-lg hidden">
                <div id="res-disease" class="text-2xl font-bold text-gray-800"></div>
                <div id="res-conf" class="text-lg font-bold text-blue-700 mt-2"></div>
            </div>
        </div>

        <!-- RISK LOGS TAB -->
        <div id="risk" class="tab-content hidden bg-white p-8 rounded-lg shadow-sm border border-gray-100 max-w-2xl mx-auto">
            <h2 class="text-xl font-bold mb-4">Submit Daily Metrics</h2>
            <form onsubmit="analyzeRisk(event)" class="space-y-5">
                <input type="number" step="0.1" id="temp" required class="w-full border rounded-md p-2.5" placeholder="Temperature (°C)">
                <input type="number" id="hum" required class="w-full border rounded-md p-2.5" placeholder="Humidity (%)">
                <input type="number" id="mort" required class="w-full border rounded-md p-2.5" placeholder="Mortality Count">
                <button id="btn-analyze-risk" type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded disabled:opacity-50">Calculate Outbreak Risk</button>
            </form>
            <div id="risk-error" class="mt-4 p-3 bg-red-100 text-red-700 rounded text-sm hidden"></div>
            <div id="risk-result" class="mt-6 p-5 rounded-lg border bg-gray-50 hidden">
                <div id="res-score" class="text-3xl font-bold text-gray-800"></div>
                <div id="res-status" class="mt-2 font-bold uppercase text-emerald-800"></div>
            </div>
        </div>

    </main>
</body>
</html>
